[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.17.0"
redis = { version = "1.7.1", features = ["tls-native-tls"] }
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15.7"
diesel = { version = "2.3.14", features = ["postgres", "r2d2"] }

